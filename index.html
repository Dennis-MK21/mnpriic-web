<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>JuaSize — Solar PV System Calculator</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#11161f">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root{
    --bg:#11161f; --card:#1b2330; --border:#2a3447;
    --cream:#f5ecd9; --cream-dim:#c9bfa8;
    --sun:#f4a93b; --sun-dim:#b97d2a;
    --sky:#5fa8d3; --muted:#818da0; --danger:#d1796a; --good:#6fb98f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  #app{min-height:100vh;padding-bottom:78px;}

  header{position:relative;overflow:hidden;border-bottom:1px solid var(--border);padding:26px 20px 20px;text-align:center;}
  header::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 50% 0%, rgba(244,169,59,.08), transparent 60%);pointer-events:none;}
  .crest{width:58px;height:58px;margin:0 auto 10px;border-radius:50%;border:1.5px solid var(--sun);display:flex;align-items:center;justify-content:center;background:var(--card);position:relative;}
  .crest svg{width:28px;height:28px;color:var(--sun);}
  .app-name{font-weight:700;font-size:25px;letter-spacing:1px;}
  .app-sub{font-size:10.5px;letter-spacing:1.5px;color:var(--sun);text-transform:uppercase;margin-top:5px;}

  .content{max-width:520px;margin:0 auto;padding:14px 16px 0;}
  .ribbon{display:flex;align-items:center;gap:10px;margin:22px 0 12px;}
  .ribbon .line{flex:1;height:1px;background:var(--border);}
  .ribbon span{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--sun);white-space:nowrap;}

  .project-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:4px;}
  .project-bar .name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
  .project-bar .actions{display:flex;gap:8px;}
  .mini-btn{background:none;border:1px solid var(--border);color:var(--cream-dim);border-radius:6px;padding:5px 9px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;}
  .mini-btn.primary{border-color:var(--sun);color:var(--sun);}

  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
  .appl-row{display:grid;grid-template-columns:1fr 54px 44px 50px 28px;gap:6px;align-items:center;margin-bottom:8px;}
  .appl-row input{margin-bottom:0;padding:8px 6px;font-size:12.5px;text-align:left;}
  .appl-row input.num{text-align:center;}
  .appl-head{display:grid;grid-template-columns:1fr 54px 44px 50px 28px;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px;}
  .chip{background:var(--bg);border:1px solid var(--border);color:var(--cream-dim);border-radius:20px;padding:5px 11px;font-size:11.5px;cursor:pointer;}
  .add-row-btn{width:100%;background:none;border:1px dashed var(--border);color:var(--sun);border-radius:8px;padding:9px;font-size:12.5px;cursor:pointer;margin-top:4px;font-family:'IBM Plex Mono',monospace;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  label.field-label{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:5px;display:block;font-family:'IBM Plex Mono',monospace;}
  input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--cream);font-family:'IBM Plex Sans',sans-serif;font-size:14px;margin-bottom:10px;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--sun);}

  .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .result-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .result-card .label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;font-family:'IBM Plex Mono',monospace;margin-bottom:4px;}
  .result-card .value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--sun);}
  .result-card .sub{font-size:11px;color:var(--cream-dim);margin-top:2px;}

  .total-cost{background:linear-gradient(135deg, rgba(244,169,59,.12), rgba(244,169,59,.02));border:1px solid var(--sun-dim);border-radius:10px;padding:16px;text-align:center;margin-top:10px;}
  .total-cost .label{font-size:10px;color:var(--sun);text-transform:uppercase;letter-spacing:1px;font-family:'IBM Plex Mono',monospace;}
  .total-cost .value{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;margin-top:4px;}

  .report-btn{width:100%;background:var(--sun);color:var(--bg);border:none;border-radius:8px;padding:13px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;cursor:pointer;margin:16px 0 8px;}

  .proj-list-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;}
  .proj-list-item .pname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
  .proj-list-item .pmeta{font-size:10.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:3px;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;}
  .empty{border:1px dashed var(--border);border-radius:10px;padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;}

  nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20;}
  nav.tabbar button{flex:1;background:none;border:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);}
  nav.tabbar button.active{color:var(--sun);}
  nav.tabbar span{font-size:10px;letter-spacing:.5px;font-family:'IBM Plex Mono',monospace;}
  nav.tabbar svg{width:19px;height:19px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(8,11,16,.78);display:flex;align-items:flex-end;z-index:40;}
  .modal{width:100%;max-height:88vh;overflow-y:auto;background:var(--card);border-top:1px solid var(--sun);border-radius:16px 16px 0 0;padding:18px 18px 28px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .modal-head span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;}
  .report-text{white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.6;color:var(--cream-dim);margin-bottom:14px;}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions button{flex:1;}
  .submit-btn{background:var(--sun);color:var(--bg);border:none;border-radius:8px;padding:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;}
  .ghost-btn{background:none;color:var(--cream);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;cursor:pointer;}
  .note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}

  /* ---- safety checks ---- */
  .check-row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
  .check-row:last-child{border-bottom:none;}
  .check-badge{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;}
  .check-badge.pass{background:rgba(111,185,143,.15);color:var(--good);}
  .check-badge.warn{background:rgba(209,121,106,.15);color:var(--danger);}
  .check-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;}
  .check-detail{font-size:12px;color:var(--cream-dim);margin-top:3px;line-height:1.5;}

  /* ---- quote tab ---- */
  .li-row{display:grid;grid-template-columns:1fr 40px 70px 34px;gap:6px;align-items:center;margin-bottom:8px;}
  .li-row input{margin-bottom:0;padding:8px 6px;font-size:12.5px;}
  .li-head{display:grid;grid-template-columns:1fr 40px 70px 34px;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
  .totals-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;color:var(--cream-dim);}
  .totals-row.grand{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--sun);border-top:1px solid var(--border);margin-top:4px;padding-top:10px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;}
  .toggle-row .tlabel{font-size:13px;}
  .switch{position:relative;width:40px;height:22px;background:var(--border);border-radius:20px;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--sun);}
  .switch .dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--cream);transition:left .15s;}
  .switch.on .dot{left:20px;}
  .link-btn{background:none;border:none;color:var(--sky);font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;padding:0;text-decoration:underline;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="crest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>
    </div>
    <div class="app-name display">JuaSize</div>
    <div class="app-sub mono">Solar PV System Calculator</div>
  </header>

  <div class="content" id="content"></div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="calc" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M16 11h0M8 15h2M12 15h2M16 15h0"/></svg>
      <span class="mono">Calculator</span>
    </button>
    <button data-tab="quote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h9l5 5v15a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1Z"/><path d="M14 2v5h5M8 13h8M8 17h5"/></svg>
      <span class="mono">Quote</span>
    </button>
    <button data-tab="projects">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
      <span class="mono">Projects</span>
    </button>
  </nav>
</div>

<div id="modal-root"></div>

<script>
/* ============================= STORAGE (per-device, no backend) ============================= */
const STORAGE_KEY = "juasize:projects";
const PROFILE_KEY = "juasize:profile";
function loadProjects(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch(e){ return []; }
}
function saveProjects(list){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch(e){ console.error(e); }
}
function loadProfile(){
  try { return JSON.parse(localStorage.getItem(PROFILE_KEY) || "null") || { businessName: "", phone: "", email: "", location: "" }; }
  catch(e){ return { businessName: "", phone: "", email: "", location: "" }; }
}
function saveProfile(p){
  try { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch(e){ console.error(e); }
}

/* ============================= DEFAULT STATE ============================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function defaultAppliances(){
  return [
    { id: uid(), name: "LED bulb", watts: 10, qty: 4, hours: 5 },
    { id: uid(), name: "TV", watts: 80, qty: 1, hours: 4 },
    { id: uid(), name: "Phone charger", watts: 10, qty: 2, hours: 3 },
  ];
}
function defaultSystem(){
  return {
    systemVoltage: 24,
    batteryType: "lithium",
    batteryVoltage: 12,
    batteryAh: 100,
    dod: 80,
    autonomyDays: 1,
    sunHours: 5,
    derate: 20,
    diversity: 80,
    headroom: 25,
    controllerType: "mppt",
    panelWatt: 400,
  };
}
function defaultCost(){
  return { pricePerPanel: 9000, pricePerBattery: 18000, inverterPrice: 15000, controllerPrice: 6000, installPct: 15 };
}
function defaultQuote(){
  return {
    customerName: "", customerLocation: "", customerPhone: "",
    lineItems: [], seeded: false,
    labourCost: 0, discount: 0, vatEnabled: false,
  };
}

let state = {
  tab: "calc",
  currentProjectId: null,
  currentProjectName: "Untitled project",
  appliances: defaultAppliances(),
  system: defaultSystem(),
  cost: defaultCost(),
  quote: defaultQuote(),
};

const MOTOR_KEYWORDS = ["pump","fridge","freezer","compressor","motor","welder","grinder","drill","saw"];

/* ============================= CALCULATIONS ============================= */
function calc(){
  const s = state.system;
  const applianceTotalWatts = state.appliances.reduce((a,x) => a + (x.watts * x.qty), 0);
  const dailyWh = state.appliances.reduce((a,x) => a + (x.watts * x.qty * x.hours), 0);
  const motorWatts = state.appliances.reduce((a,x) => {
    const isMotor = MOTOR_KEYWORDS.some(k => (x.name||"").toLowerCase().includes(k));
    return a + (isMotor ? x.watts * x.qty : 0);
  }, 0);

  const diversity = s.diversity / 100;
  const derate = s.derate / 100;
  const dod = s.dod / 100;
  const headroom = s.headroom / 100;

  const adjustedDailyWh = (dailyWh * diversity) / (1 - derate);
  const pvArrayWp = adjustedDailyWh / s.sunHours;
  const panelCount = Math.max(1, Math.ceil(pvArrayWp / s.panelWatt));
  const actualArrayWp = panelCount * s.panelWatt;

  const requiredBatteryWh = (adjustedDailyWh * s.autonomyDays) / dod;
  const bankAh = requiredBatteryWh / s.systemVoltage;
  const seriesCount = Math.max(1, Math.round(s.systemVoltage / s.batteryVoltage));
  const stringsNeeded = Math.max(1, Math.ceil(bankAh / s.batteryAh));
  const totalBatteries = seriesCount * stringsNeeded;
  const actualBankAh = stringsNeeded * s.batteryAh;

  const inverterRawVA = (applianceTotalWatts * diversity * (1 + headroom)) / 0.8;
  const standardInverterSizes = [500,1000,1500,2000,2500,3000,4000,5000,6000,8000,10000];
  const inverterVA = standardInverterSizes.find(v => v >= inverterRawVA) || Math.ceil(inverterRawVA/1000)*1000;

  const ccRawAmps = (actualArrayWp * 1.25) / s.systemVoltage;
  const standardCCSizes = [10,20,30,40,50,60,80,100];
  const ccAmps = standardCCSizes.find(v => v >= ccRawAmps) || Math.ceil(ccRawAmps/10)*10;

  const c = state.cost;
  const panelsCost = panelCount * c.pricePerPanel;
  const batteriesCost = totalBatteries * c.pricePerBattery;
  const subtotal = panelsCost + batteriesCost + c.inverterPrice + c.controllerPrice;
  const installCost = subtotal * (c.installPct / 100);
  const totalCost = subtotal + installCost;

  // ---- safety checks ----
  const voltageMatchOk = (s.systemVoltage % s.batteryVoltage === 0);
  const usableBatteryWh = actualBankAh * s.systemVoltage * dod;
  const backupDaysAchieved = adjustedDailyWh > 0 ? usableBatteryWh / adjustedDailyWh : 0;
  const backupOk = backupDaysAchieved >= s.autonomyDays - 0.05;

  const nonMotorWatts = applianceTotalWatts - motorWatts;
  const surgeRawVA = ((nonMotorWatts * diversity) + (motorWatts * 3)) / 0.8;
  const recommendedSurgeVA = standardInverterSizes.find(v => v >= surgeRawVA) || Math.ceil(surgeRawVA/1000)*1000;
  const surgeOk = motorWatts === 0 || inverterVA >= recommendedSurgeVA;

  const ccHeadroomOk = ccAmps >= ccRawAmps;

  return {
    applianceTotalWatts, dailyWh, adjustedDailyWh, motorWatts,
    pvArrayWp: actualArrayWp, panelCount,
    bankAh: actualBankAh, totalBatteries, seriesCount, stringsNeeded,
    inverterVA, ccAmps,
    panelsCost, batteriesCost, subtotal, installCost, totalCost,
    voltageMatchOk, backupDaysAchieved, backupOk,
    recommendedSurgeVA, surgeOk, ccHeadroomOk,
  };
}

function fmt(n){ return Math.round(n).toLocaleString(); }

/* ============================= RENDER: CALCULATOR TAB ============================= */
const QUICK_ADD = [
  {name:"LED bulb", watts:10}, {name:"Fridge", watts:150}, {name:"TV", watts:80},
  {name:"Laptop", watts:65}, {name:"Fan", watts:50}, {name:"Water pump", watts:750},
  {name:"Iron box", watts:1000}, {name:"Router", watts:10},
];

function checkRow(ok, title, detail){
  return `<div class="check-row">
    <div class="check-badge ${ok ? 'pass' : 'warn'}">${ok ? '✓' : '!'}</div>
    <div><div class="check-title">${esc(title)}</div><div class="check-detail">${detail}</div></div>
  </div>`;
}

function renderSafetyChecks(r){
  const s = state.system;
  let html = "";
  html += checkRow(r.voltageMatchOk,
    "Battery / system voltage match",
    r.voltageMatchOk
      ? `${r.seriesCount} × ${s.batteryVoltage}V batteries in series = ${s.systemVoltage}V. Matches your system voltage.`
      : `${s.batteryVoltage}V batteries don't divide evenly into ${s.systemVoltage}V. Pick a battery voltage that divides evenly (e.g. 12V batteries for a 24V or 48V system).`
  );
  html += checkRow(r.backupOk,
    "Battery backup time",
    r.backupOk
      ? `Battery bank gives ~${r.backupDaysAchieved.toFixed(1)} days backup, meeting your ${s.autonomyDays}-day target.`
      : `Battery bank only gives ~${r.backupDaysAchieved.toFixed(1)} days backup — short of your ${s.autonomyDays}-day target. Increase battery Ah or count.`
  );
  html += checkRow(r.surgeOk,
    "Inverter starting surge (motor loads)",
    r.motorWatts === 0
      ? `No motor-type loads detected (pumps, fridges, compressors) — standard sizing applies.`
      : r.surgeOk
        ? `${fmt(r.motorWatts)}W of motor loads detected. ${fmt(r.inverterVA)}VA inverter covers the ~3× starting surge.`
        : `${fmt(r.motorWatts)}W of motor loads detected (pumps/fridges start at ~3× their running watts). Recommend at least ${fmt(r.recommendedSurgeVA)}VA, not ${fmt(r.inverterVA)}VA.`
  );
  html += checkRow(r.ccHeadroomOk,
    "Charge controller sizing",
    `${fmt(r.ccAmps)}A ${s.controllerType.toUpperCase()} controller covers the ${fmt(r.pvArrayWp)}Wp array with a 25% safety margin.`
  );
  html += `<div class="note">These are engineering estimates based on standard sizing practice — always verify panel Voc/Isc against your charge controller's input rating sheet before final purchase.</div>`;
  return html;
}

function renderCalc(){
  const r = calc();
  const el = document.getElementById("content");
  el.innerHTML = `
    <div class="project-bar">
      <span class="name">${esc(state.currentProjectName)}</span>
      <div class="actions">
        <button class="mini-btn" id="btn-new">New</button>
        <button class="mini-btn primary" id="btn-save">Save</button>
      </div>
    </div>

    <div class="ribbon"><div class="line"></div><span>Appliance Loads</span><div class="line"></div></div>
    <div class="card">
      <div class="appl-head"><span>Appliance</span><span>Watts</span><span>Qty</span><span>Hrs/day</span><span></span></div>
      <div id="appl-rows"></div>
      <div class="chips" id="quick-add"></div>
      <button class="add-row-btn" id="btn-add-row">+ Add appliance</button>
    </div>

    <div class="ribbon"><div class="line"></div><span>System Parameters</span><div class="line"></div></div>
    <div class="card">
      <div class="field-grid">
        <div><label class="field-label">System voltage</label>
          <select id="f-systemVoltage"><option value="12">12V</option><option value="24">24V</option><option value="48">48V</option></select></div>
        <div><label class="field-label">Battery type</label>
          <select id="f-batteryType"><option value="lithium">Lithium (LiFePO4)</option><option value="leadacid">Lead-acid</option></select></div>
        <div><label class="field-label">Battery voltage</label><input id="f-batteryVoltage" type="number" value="${state.system.batteryVoltage}"></div>
        <div><label class="field-label">Battery capacity (Ah)</label><input id="f-batteryAh" type="number" value="${state.system.batteryAh}"></div>
        <div><label class="field-label">Depth of discharge (%)</label><input id="f-dod" type="number" value="${state.system.dod}"></div>
        <div><label class="field-label">Autonomy (days)</label><input id="f-autonomyDays" type="number" value="${state.system.autonomyDays}"></div>
        <div><label class="field-label">Peak sun hours</label><input id="f-sunHours" type="number" value="${state.system.sunHours}"></div>
        <div><label class="field-label">Panel wattage (Wp)</label><input id="f-panelWatt" type="number" value="${state.system.panelWatt}"></div>
        <div><label class="field-label">System losses / derate (%)</label><input id="f-derate" type="number" value="${state.system.derate}"></div>
        <div><label class="field-label">Load diversity (%)</label><input id="f-diversity" type="number" value="${state.system.diversity}"></div>
        <div><label class="field-label">Inverter headroom (%)</label><input id="f-headroom" type="number" value="${state.system.headroom}"></div>

function seedQuoteLineItems(r){
  const s = state.system;
  state.quote.lineItems = [
    { id: uid(), desc: `${s.panelWatt}W Solar Panel`, qty: r.panelCount, unitPrice: state.cost.pricePerPanel },
    { id: uid(), desc: `${s.batteryAh}Ah ${s.batteryType === "lithium" ? "Lithium" : "Lead-acid"} Battery`, qty: r.totalBatteries, unitPrice: state.cost.pricePerBattery },
    { id: uid(), desc: `${fmt(r.inverterVA)}VA Inverter`, qty: 1, unitPrice: state.cost.inverterPrice },
    { id: uid(), desc: `${fmt(r.ccAmps)}A ${s.controllerType.toUpperCase()} Charge Controller`, qty: 1, unitPrice: state.cost.controllerPrice },
  ];
  state.quote.seeded = true;
}

function quoteTotals(){
  const itemsSubtotal = state.quote.lineItems.reduce((a,x) => a + (x.qty * x.unitPrice), 0);
  const withLabour = itemsSubtotal + (state.quote.labourCost || 0);
  const afterDiscount = Math.max(0, withLabour - (state.quote.discount || 0));
  const vatAmount = state.quote.vatEnabled ? afterDiscount * 0.16 : 0;
  const grandTotal = afterDiscount + vatAmount;
  return { itemsSubtotal, withLabour, afterDiscount, vatAmount, grandTotal };
}

function generateQuotePDF(){
  if (!window.jspdf) { alert("PDF library didn't load — check your internet connection and try again."); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const profile = loadProfile();
  const t = quoteTotals();
  const dateStr = new Date().toLocaleDateString();
  let y = 20;

  doc.setFont("helvetica","bold"); doc.setFontSize(18);
  doc.text(profile.businessName || "Solar Quotation", 14, y); y += 7;
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  if (profile.phone) { doc.text(`Tel: ${profile.phone}`, 14, y); y += 5; }
  if (profile.email) { doc.text(`Email: ${profile.email}`, 14, y); y += 5; }
  if (profile.location) { doc.text(profile.location, 14, y); y += 5; }

  y += 4;
  doc.setDrawColor(200); doc.line(14, y, 196, y); y += 8;

  doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.text("QUOTATION", 14, y); y += 7;
  doc.setFont("helvetica","normal"); doc.setFontSize(10);
  doc.text(`Date: ${dateStr}`, 14, y); y += 6;
  doc.text(`Customer: ${state.quote.customerName || "-"}`, 14, y); y += 6;
  if (state.quote.customerLocation) { doc.text(`Site: ${state.quote.customerLocation}`, 14, y); y += 6; }
  if (state.quote.customerPhone) { doc.text(`Phone: ${state.quote.customerPhone}`, 14, y); y += 6; }

  y += 4;
  doc.setFont("helvetica","bold");
  doc.text("Description", 14, y); doc.text("Qty", 130, y); doc.text("Unit (KES)", 150, y); doc.text("Total (KES)", 178, y);
  y += 2; doc.setDrawColor(200); doc.line(14, y, 196, y); y += 6;
  doc.setFont("helvetica","normal");

  state.quote.lineItems.forEach(li => {
    if (y > 270) { doc.addPage(); y = 20; }
    doc.text(String(li.desc || "-").slice(0,45), 14, y);
    doc.text(String(li.qty), 130, y);
    doc.text(fmt(li.unitPrice), 150, y);
    doc.text(fmt(li.qty * li.unitPrice), 178, y);
    y += 7;
  });

  y += 2; doc.line(130, y, 196, y); y += 7;
  doc.text("Equipment subtotal", 130, y); doc.text(fmt(t.itemsSubtotal), 178, y); y += 7;
  doc.text("Labour / installation", 130, y); doc.text(fmt(state.quote.labourCost || 0), 178, y); y += 7;
  if (state.quote.discount > 0) { doc.text("Discount", 130, y); doc.text("-" + fmt(state.quote.discount), 178, y); y += 7; }
  if (state.quote.vatEnabled) { doc.text("VAT (16%)", 130, y); doc.text(fmt(t.vatAmount), 178, y); y += 7; }
  y += 2; doc.setDrawColor(0); doc.line(130, y, 196, y); y += 7;
  doc.setFont("helvetica","bold"); doc.setFontSize(12);
  doc.text("GRAND TOTAL", 130, y); doc.text(`KES ${fmt(t.grandTotal)}`, 178, y); y += 14;

  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(120);
  doc.text("Generated with JuaSize. Figures are engineering estimates — confirm final pricing with supplier quotes.", 14, y);

  const safeName = (state.quote.customerName || "quotation").replace(/[^a-z0-9]/gi, "_");
  doc.save(`Quote-${safeName}-${dateStr.replace(/\//g,"-")}.pdf`);
}

function shareQuoteText(){
  const profile = loadProfile();
  const t = quoteTotals();
  const dateStr = new Date().toLocaleDateString();
  let text = `SOLAR QUOTATION\n${profile.businessName || ""}${profile.phone ? " · " + profile.phone : ""}\nDate: ${dateStr}\n\n`;
  text += `Customer: ${state.quote.customerName || "-"}\n`;
  if (state.quote.customerLocation) text += `Site: ${state.quote.customerLocation}\n`;
  text += `\nEQUIPMENT\n`;
  state.quote.lineItems.forEach(li => {
    text += `${li.desc || "-"} x${li.qty} @ KES ${fmt(li.unitPrice)} = KES ${fmt(li.qty*li.unitPrice)}\n`;
  });
  text += `\nEquipment subtotal: KES ${fmt(t.itemsSubtotal)}\n`;
  text += `Labour/installation: KES ${fmt(state.quote.labourCost || 0)}\n`;
  if (state.quote.discount > 0) text += `Discount: -KES ${fmt(state.quote.discount)}\n`;
  if (state.quote.vatEnabled) text += `VAT (16%): KES ${fmt(t.vatAmount)}\n`;
  text += `\nGRAND TOTAL: KES ${fmt(t.grandTotal)}\n\nGenerated with JuaSize`;

  (async () => {
    if (navigator.share) {
      try { await navigator.share({ title: "Solar Quotation", text }); return; } catch(e){ /* cancelled */ }
    }
    try { await navigator.clipboard.writeText(text); alert("Quotation copied — paste it into WhatsApp."); }
    catch(e){ alert("Sharing isn't supported here — copy the quotation manually."); }
  })();
}

function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

function openSaveModal(){
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><span>Save project</span><button class="icon-btn" onclick="closeModal()">✕</button></div>
        <label class="field-label">Project name</label>
        <input id="save-name" value="${esc(state.currentProjectName === 'Untitled project' ? '' : state.currentProjectName)}" placeholder="e.g. Mama Jane's house">
        <button class="submit-btn" id="confirm-save" style="width:100%">Save</button>
      </div>
    </div>`;
  document.getElementById("backdrop").addEventListener("click", closeModal);
  document.getElementById("confirm-save").addEventListener("click", () => {
    const name = document.getElementById("save-name").value.trim() || "Untitled project";
    const projects = loadProjects();
    const now = Date.now();
    if (state.currentProjectId) {
      const idx = projects.findIndex(p => p.id === state.currentProjectId);
      const record = { id: state.currentProjectId, name, appliances: state.appliances, system: state.system, cost: state.cost, quote: state.quote, createdAt: idx >= 0 ? projects[idx].createdAt : now, updatedAt: now };
      if (idx >= 0) projects[idx] = record; else projects.push(record);
    } else {
      const id = uid();
      state.currentProjectId = id;
      projects.push({ id, name, appliances: state.appliances, system: state.system, cost: state.cost, quote: state.quote, createdAt: now, updatedAt: now });
    }
    state.currentProjectName = name;
    saveProjects(projects);
    closeModal();
    renderCalc();
  });
}

function buildReportText(r){
  const s = state.system;
  return `JUASIZE — SOLAR PV SIZING REPORT
Project: ${state.currentProjectName}
Date: ${new Date().toLocaleDateString()}

LOAD SUMMARY
Daily energy need: ${fmt(r.dailyWh)} Wh
Connected load: ${fmt(r.applianceTotalWatts)} W

SYSTEM SIZING
PV Array: ${fmt(r.pvArrayWp)} Wp  (${r.panelCount} × ${s.panelWatt}W panels)
Battery Bank: ${fmt(r.bankAh)} Ah @ ${s.systemVoltage}V  (${r.totalBatteries} × ${s.batteryAh}Ah batteries, ${r.seriesCount}S${r.stringsNeeded}P)
Inverter: ${fmt(r.inverterVA)} VA
Charge Controller: ${fmt(r.ccAmps)} A (${s.controllerType.toUpperCase()})

SAFETY CHECKS
Voltage match: ${r.voltageMatchOk ? "PASS" : "WARNING"}
Backup time: ${r.backupDaysAchieved.toFixed(1)} days (target ${s.autonomyDays}) — ${r.backupOk ? "PASS" : "WARNING"}
Starting surge: ${r.surgeOk ? "PASS" : "WARNING — recommend " + fmt(r.recommendedSurgeVA) + "VA inverter"}

ESTIMATED COST (KES)
Panels: ${fmt(r.panelsCost)}
Batteries: ${fmt(r.batteriesCost)}
Inverter: ${fmt(state.cost.inverterPrice)}
Charge controller: ${fmt(state.cost.controllerPrice)}
Installation/misc (${state.cost.installPct}%): ${fmt(r.installCost)}
TOTAL: KES ${fmt(r.totalCost)}

Generated with JuaSize`;
}

function openReportModal(r){
  const text = buildReportText(r);
  const root = document.getElementById("modal-root");
  root.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><span>Shareable Report</span><button class="icon-btn" onclick="closeModal()">✕</button></div>
        <div class="report-text">${esc(text)}</div>
        <div class="modal-actions">
          <button class="ghost-btn" id="btn-copy">Copy</button>
          <button class="submit-btn" id="btn-share">Share</button>
        </div>
      </div>
    </div>`;
  document.getElementById("backdrop").addEventListener("click", closeModal);
  document.getElementById("btn-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); document.getElementById("btn-copy").textContent = "Copied!"; }
    catch(e){ alert("Couldn't copy — long-press the text above to copy manually."); }
  });
  document.getElementById("btn-share").addEventListener("click", async () => {
    if (navigator.share) {
      try { await navigator.share({ title: "JuaSize Report", text }); }
      catch(e){ /* user cancelled */ }
    } else {
      try { await navigator.clipboard.writeText(text); alert("Report copied — paste it into WhatsApp or email."); }
      catch(e){ alert("Sharing isn't supported on this browser — copy the text manually."); }
    }
  });
}

/* ============================= HELPERS ============================= */
function esc(str){ const d = document.createElement("div"); d.innerText = str == null ? "" : str; return d.innerHTML; }

function renderAll(){
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
  if (state.tab === "calc") renderCalc();
  else if (state.tab === "quote") renderQuote();
  else renderProjects();
}

document.getElementById("tabbar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  state.tab = btn.dataset.tab;
  renderAll();
});

renderAll();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>
</body>
