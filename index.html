<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>MNPRIIC — Research, Innovation & Invention Club</title>

<!-- ====================================================================
  SETUP NOTE (read this before publishing):
  This file needs a Firebase project connected before the shared data
  will work. Search "firebaseConfig" below and paste in your own keys.
  Full step-by-step instructions were given alongside this file.
======================================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#141b26; --card:#1e2a3c; --border:#2c3a4f;
    --cream:#eee3ce; --cream-dim:#b9ae98;
    --gold:#c2a15e; --gold-dim:#8a744a;
    --steel:#7fa0bd; --muted:#7c8798; --danger:#c47b6a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}
  #app{min-height:100vh;padding-bottom:78px;}

  header{position:relative;overflow:hidden;border-bottom:1px solid var(--border);padding:28px 20px 22px;text-align:center;}
  header::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(194,161,94,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(194,161,94,.06) 1px,transparent 1px);background-size:26px 26px;pointer-events:none;}
  .crest{width:62px;height:62px;margin:0 auto 12px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;background:var(--card);position:relative;}
  .crest svg{width:26px;height:26px;color:var(--cream);}
  .club-name{font-weight:700;font-size:26px;letter-spacing:1px;}
  .club-sub{font-size:10.5px;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase;margin-top:6px;}
  .club-school{font-size:11px;color:var(--muted);margin-top:3px;}

  .content{max-width:480px;margin:0 auto;padding:0 16px;}
  .ribbon{display:flex;align-items:center;gap:10px;margin:22px 0 12px;}
  .ribbon .line{flex:1;height:1px;background:var(--border);}
  .ribbon span{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);white-space:nowrap;}

  .empty{border:1px dashed var(--border);border-radius:10px;padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;}
  .spinner-wrap{display:flex;justify-content:center;padding:30px;}
  .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .card-body{font-size:13px;color:var(--cream-dim);margin-top:6px;line-height:1.5;}
  .card-meta{font-size:10px;color:var(--muted);margin-top:8px;font-family:'IBM Plex Mono',monospace;}
  .icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px;}

  .projects-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tag{display:inline-block;font-size:9px;color:var(--bg);background:var(--steel);border-radius:4px;padding:2px 6px;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;}
  .proj-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;position:relative;}
  .proj-card .icon-btn{position:absolute;top:10px;right:10px;}
  .proj-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;margin-bottom:4px;}
  .proj-desc{font-size:12px;color:var(--cream-dim);line-height:1.4;margin-bottom:8px;}
  .proj-inventor{font-size:10px;color:var(--gold);font-family:'IBM Plex Mono',monospace;}

  .event-row{display:flex;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
  .date-badge{width:44px;text-align:center;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 0;flex-shrink:0;height:fit-content;}
  .date-badge .num{font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--gold);font-weight:600;}
  .date-badge .mon{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase;}

  .member-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .member-left{display:flex;align-items:center;gap:10px;}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;color:var(--gold);flex-shrink:0;}
  .member-name{font-weight:600;font-size:13.5px;}
  .member-role{font-size:10px;color:var(--steel);font-family:'IBM Plex Mono',monospace;}

  .fab{position:fixed;right:18px;bottom:88px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--bg);border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;z-index:30;font-size:26px;}
  nav.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20;}
  nav.tabbar button{flex:1;background:none;border:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);}
  nav.tabbar button.active{color:var(--gold);}
  nav.tabbar span{font-size:9.5px;letter-spacing:.5px;font-family:'IBM Plex Mono',monospace;}
  nav.tabbar svg{width:19px;height:19px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,14,20,.72);display:flex;align-items:flex-end;z-index:40;}
  .modal{width:100%;max-height:85vh;overflow-y:auto;background:var(--card);border-top:1px solid var(--gold);border-radius:16px 16px 0 0;padding:18px 18px 28px;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .modal-head span{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;}
  label.field-label{font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block;font-family:'IBM Plex Mono',monospace;}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--cream);font-family:'IBM Plex Sans',sans-serif;font-size:14px;margin-bottom:12px;outline:none;}
  input:focus,textarea:focus{border-color:var(--gold);}
  textarea{min-height:80px;resize:vertical;}
  .submit-btn{width:100%;background:var(--gold);color:var(--bg);border:none;border-radius:8px;padding:12px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;cursor:pointer;}
  .banner{margin:14px 16px 0;padding:10px 12px;border:1px solid var(--danger);border-radius:8px;color:var(--danger);font-size:12px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="crest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.5.5.8 1 .8 1.7V16h6.4v-.8c0-.7.3-1.2.8-1.7A6 6 0 0 0 12 3Z"/></svg>
    </div>
    <div class="club-name display">MNPRIIC</div>
    <div class="club-sub mono">Research · Innovation &amp; Invention Club</div>
    <div class="club-school">Mitunguu National Polytechnic</div>
  </header>

  <div id="config-banner"></div>
  <div class="content" id="content"></div>
  <button class="fab" id="fab" aria-label="Add">+</button>

  <nav class="tabbar" id="tabbar">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5Z"/></svg><span class="mono">Home</span></button>
    <button data-tab="projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.5.5.8 1 .8 1.7V16h6.4v-.8c0-.7.3-1.2.8-1.7A6 6 0 0 0 12 3Z"/></svg><span class="mono">Projects</span></button>
    <button data-tab="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span class="mono">Events</span></button>
    <button data-tab="members"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.7-3.5 3.3-5.5 6.5-5.5s5.8 2 6.5 5.5"/><circle cx="17" cy="8" r="2.6"/><path d="M15.8 14.8c2.5.3 4.3 2.1 4.9 5.2"/></svg><span class="mono">Members</span></button>
  </nav>
</div>

<div id="modal-root"></div>

<!-- Firebase SDK (compat build — no bundler needed) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =====================================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (from Firebase Console → Project
      settings → General → "Your apps" → SDK setup and configuration).
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyAtjiraEL4rJGyaYGL58bs_N5m898GAOoM",
  authDomain: "riic-827e8.firebaseapp.com",
  projectId: "riic-827e8",
  storageBucket: "riic-827e8.firebasestorage.app",
  messagingSenderId: "172520606590",
  appId: "1:172520606590:web:aa8b20d7f5d10a6ab6412f"
};

let db = null;
let firebaseReady = false;
try {
  if (!firebaseConfig.apiKey.startsWith("PASTE_")) {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }
} catch (e) {
  console.error("Firebase init failed", e);
}

if (!firebaseReady) {
  document.getElementById("config-banner").innerHTML =
    '<div class="banner">Firebase isn\'t connected yet — paste your config in index.html (see setup guide) for shared data to work.</div>';
}

/* ---------------------- helpers ---------------------- */
const state = { tab: "home", data: { announcements: [], projects: [], events: [], members: [] }, loading: { announcements: true, projects: true, events: true, members: true } };
const contentEl = document.getElementById("content");
const modalRoot = document.getElementById("modal-root");

function esc(str){
  const d = document.createElement("div");
  d.innerText = str == null ? "" : str;
  return d.innerHTML;
}

function listen(collection){
  if (!db) { state.loading[collection] = false; render(); return; }
  db.collection(collection).orderBy("createdAt", "desc").onSnapshot(
    (snap) => {
      state.data[collection] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      state.loading[collection] = false;
      render();
    },
    (err) => {
      console.error(err);
      state.loading[collection] = false;
      render();
    }
  );
}
["announcements","projects","events","members"].forEach(listen);

function addDoc(collection, fields){
  if (!db) { alert("Connect Firebase first — see setup guide."); return; }
  db.collection(collection).add({ ...fields, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
}
function removeDoc(collection, id){
  if (!db) return;
  db.collection(collection).doc(id).delete();
}

/* ---------------------- rendering ---------------------- */
function spinnerOrEmpty(loading, items, emptyText){
  if (loading) return '<div class="spinner-wrap"><div class="spinner"></div></div>';
  if (items.length === 0) return `<div class="empty">${esc(emptyText)}</div>`;
  return null;
}

function renderHome(){
  const { announcements } = state.data;
  const skip = spinnerOrEmpty(state.loading.announcements, announcements, "No announcements yet. Post the first update for the club.");
  let body = skip !== null ? skip : announcements.map(a => `
    <div class="card">
      <div class="card-top">
        <div class="card-title">${esc(a.title)}</div>
        <button class="icon-btn" onclick="removeDoc('announcements','${a.id}')">✕</button>
      </div>
      <div class="card-body">${esc(a.body)}</div>
      <div class="card-meta">— ${esc(a.author || "Club Board")}</div>
    </div>`).join("");
  contentEl.innerHTML = `<div class="ribbon"><div class="line"></div><span>Announcements</span><div class="line"></div></div>${body}`;
}

function renderProjects(){
  const { projects } = state.data;
  const skip = spinnerOrEmpty(state.loading.projects, projects, "No projects logged yet. Be the first to add an invention.");
  let body;
  if (skip !== null) body = skip;
  else {
    body = `<div class="projects-grid">` + projects.map(p => `
      <div class="proj-card">
        <span class="tag">${esc((p.category || "GENERAL").toUpperCase())}</span>
        <button class="icon-btn" onclick="removeDoc('projects','${p.id}')">✕</button>
        <div class="proj-title">${esc(p.title)}</div>
        <div class="proj-desc">${esc(p.description)}</div>
        <div class="proj-inventor">${esc(p.inventor)}</div>
      </div>`).join("") + `</div>`;
  }
  contentEl.innerHTML = `<div class="ribbon"><div class="line"></div><span>Project Showcase</span><div class="line"></div></div>${body}`;
}

function renderEvents(){
  const events = [...state.data.events].sort((a,b) => new Date(a.date) - new Date(b.date));
  const skip = spinnerOrEmpty(state.loading.events, events, "No events scheduled. Add the next meeting or competition.");
  let body = skip !== null ? skip : events.map(e => {
    const d = new Date(e.date);
    const valid = !isNaN(d.getTime());
    return `
    <div class="event-row">
      <div class="date-badge">
        <div class="num">${valid ? d.getDate() : "--"}</div>
        <div class="mon">${valid ? d.toLocaleString('default',{month:'short'}) : ""}</div>
      </div>
      <div style="flex:1">
        <div class="card-top">
          <div class="card-title" style="font-size:14px">${esc(e.title)}</div>
          <button class="icon-btn" onclick="removeDoc('events','${e.id}')">✕</button>
        </div>
        <div class="card-body" style="font-size:12px">${esc(e.description)}</div>
        ${e.location ? `<div class="card-meta" style="color:var(--steel)">@ ${esc(e.location)}</div>` : ""}
      </div>
    </div>`;
  }).join("");
  contentEl.innerHTML = `<div class="ribbon"><div class="line"></div><span>Upcoming &amp; Past Events</span><div class="line"></div></div>${body}`;
}

function renderMembers(){
  const { members } = state.data;
  const skip = spinnerOrEmpty(state.loading.members, members, "No members registered yet. Add the first sign-up.");
  let body = skip !== null ? skip : members.map(m => `
    <div class="member-row">
      <div class="member-left">
        <div class="avatar">${esc((m.name || "?").charAt(0).toUpperCase())}</div>
        <div>
          <div class="member-name">${esc(m.name)}</div>
          <div class="member-role">${esc(m.role || "Member")}${m.contact ? " · " + esc(m.contact) : ""}</div>
        </div>
      </div>
      <button class="icon-btn" onclick="removeDoc('members','${m.id}')">✕</button>
    </div>`).join("");
  contentEl.innerHTML = `<div class="ribbon"><div class="line"></div><span>Members (${members.length}/50)</span><div class="line"></div></div>${body}`;
}

function render(){
  document.querySelectorAll("nav.tabbar button").forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
  if (state.tab === "home") renderHome();
  else if (state.tab === "projects") renderProjects();
  else if (state.tab === "events") renderEvents();
  else if (state.tab === "members") renderMembers();
}

document.getElementById("tabbar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  state.tab = btn.dataset.tab;
  render();
});

/* ---------------------- modals / forms ---------------------- */
function closeModal(){ modalRoot.innerHTML = ""; }

function openModal(type){
  const forms = {
    announcement: {
      title: "Post an announcement",
      fields: `
        <label class="field-label">Title</label><input id="f-title" required>
        <label class="field-label">Message</label><textarea id="f-body" required></textarea>
        <label class="field-label">Posted by</label><input id="f-author" placeholder="Your name">
      `,
      submitLabel: "Post announcement",
      onSubmit: () => {
        const title = document.getElementById("f-title").value.trim();
        const body = document.getElementById("f-body").value.trim();
        const author = document.getElementById("f-author").value.trim();
        if (!title || !body) return;
        addDoc("announcements", { title, body, author });
        closeModal();
      }
    },
    project: {
      title: "Add a project",
      fields: `
        <label class="field-label">Project title</label><input id="f-title" required>
        <label class="field-label">Inventor(s)</label><input id="f-inventor" required>
        <label class="field-label">Category</label><input id="f-category" placeholder="e.g. Robotics, Agri-tech">
        <label class="field-label">Description</label><textarea id="f-desc"></textarea>
      `,
      submitLabel: "Add project",
      onSubmit: () => {
        const title = document.getElementById("f-title").value.trim();
        const inventor = document.getElementById("f-inventor").value.trim();
        const category = document.getElementById("f-category").value.trim();
        const description = document.getElementById("f-desc").value.trim();
        if (!title || !inventor) return;
        addDoc("projects", { title, inventor, category, description });
        closeModal();
      }
    },
    event: {
      title: "Add an event",
      fields: `
        <label class="field-label">Event title</label><input id="f-title" required>
        <label class="field-label">Date</label><input id="f-date" type="date" required>
        <label class="field-label">Location</label><input id="f-location" placeholder="e.g. Engineering Hall">
        <label class="field-label">Description</label><textarea id="f-desc"></textarea>
      `,
      submitLabel: "Add event",
      onSubmit: () => {
        const title = document.getElementById("f-title").value.trim();
        const date = document.getElementById("f-date").value;
        const location = document.getElementById("f-location").value.trim();
        const description = document.getElementById("f-desc").value.trim();
        if (!title || !date) return;
        addDoc("events", { title, date, location, description });
        closeModal();
      }
    },
    member: {
      title: "Register a member",
      fields: `
        <label class="field-label">Full name</label><input id="f-name" required>
        <label class="field-label">Role</label><input id="f-role" placeholder="e.g. Member, Secretary">
        <label class="field-label">Contact</label><input id="f-contact" placeholder="Phone or email">
      `,
      submitLabel: state.data.members.length >= 50 ? "Directory full (50/50)" : "Register member",
      onSubmit: () => {
        if (state.data.members.length >= 50) return;
        const name = document.getElementById("f-name").value.trim();
        const role = document.getElementById("f-role").value.trim();
        const contact = document.getElementById("f-contact").value.trim();
        if (!name) return;
        addDoc("members", { name, role, contact });
        closeModal();
      }
    }
  };

  const f = forms[type];
  modalRoot.innerHTML = `
    <div class="modal-backdrop" id="backdrop">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><span>${esc(f.title)}</span><button class="icon-btn" onclick="closeModal()">✕</button></div>
        <form id="modal-form">
          ${f.fields}
          <button type="submit" class="submit-btn">${esc(f.submitLabel)}</button>
        </form>
      </div>
    </div>`;
  document.getElementById("backdrop").addEventListener("click", closeModal);
  document.getElementById("modal-form").addEventListener("submit", (e) => { e.preventDefault(); f.onSubmit(); });
}

document.getElementById("fab").addEventListener("click", () => {
  const map = { home: "announcement", projects: "project", events: "event", members: "member" };
  openModal(map[state.tab]);
});

render();
</script>
</body>
</html>
